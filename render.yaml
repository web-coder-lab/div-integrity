# Blueprint — create 8 free web services (set repo in dashboard if needed)
services:
  - type: web
    name: div-auth
    runtime: node
    plan: free
    region: singapore
    rootDir: servers/01-auth-div-auth
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
